version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/securetaskpro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secure_production_secret_key_13579
      - JWT_EXPIRE=15m
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=development
    depends_on:
      - mongodb
      - redis
    networks:
      - securetask-network

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - securetask-network

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - securetask-network

networks:
  securetask-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
